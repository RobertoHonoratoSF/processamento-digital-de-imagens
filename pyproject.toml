[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "processamento-digital-de-imagens"
version = "1.0.0"
description = "Aplicação didática para operações de processamento digital de imagens"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "scipy>=1.10,<2",
  "Pillow>=9.4,<13",
  "streamlit>=1.32,<2",
  "matplotlib>=3.7,<4",
]

[project.optional-dependencies]
dev = ["pytest>=7.2,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

